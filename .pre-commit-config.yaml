repos:
  - repo: local
    hooks:
      - id: goimports
        name: goimports
        entry: goimports
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint
        args: ["run"]
        language: system
        types: [go]
        pass_filenames: false

  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: trailing-whitespace
        exclude_types: [svg]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
