x-sentry-service-config:
  version: 0.1
  service_name: vroom
  dependencies:
    vroom:
      description: Sentry's profiling service, processing and deriving data about your profiles
  modes:
    default: [vroom]
services:
  vroom:
    image: ghcr.io/getsentry/vroom:nightly
    ports:
      - 127.0.0.1:8085:8085
    environment:
      SENTRY_BUCKET_PROFILES: file://localhost//var/lib/sentry-profiles
      SENTRY_SNUBA_HOST: http://127.0.0.1:1218
    volumes:
      - /tmp/sentry-profiles:/var/lib/sentry-profiles
    networks:
      - devservices
    extra_hosts:
      host.docker.internal: host-gateway
    labels:
      - orchestrator=devservices
    restart: unless-stopped

networks:
  devservices:
    name: devservices
    external: true
